services:
  postgres:
    image: postgres:15-alpine
    container_name: groupware-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=jules
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=groupware
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: groupware-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - postgres
